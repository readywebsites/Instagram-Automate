<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - IG Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 44px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .form-control {
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <h4 class="fw-bold text-center mb-2">Forgot Password?</h4>
    <p class="text-muted text-center mb-4" style="font-size: 14px;">
        Enter your registered email address and we'll send you instructions to reset your password.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} rounded-3 border-0 py-2">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <button type="submit" class="btn btn-dark w-100 py-3 fw-bold rounded-3 mb-3">
            Send Reset Link
        </button>
    </form>

    <div class="text-center">
        <a href="{% url 'login' %}" class="text-decoration-none text-muted fw-semibold" style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Back to Login
        </a>
    </div>
</div>

</body>
</html>
