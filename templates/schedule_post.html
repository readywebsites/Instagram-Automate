{% extends "base.html" %}{% block content %}
<h2>Schedule Instagram Post</h2>
<div class="card p-4 mt-3" style="max-width:800px">
<form method="post" enctype="multipart/form-data">{% csrf_token %}
<div class="mb-3"><label class="form-label">Image</label>{{ form.image }}</div>
<div class="mb-3"><label class="form-label">Caption</label>{{ form.caption }}</div>
<div class="mb-3"><label class="form-label">Date & Time</label>{{ form.scheduled_at }}</div>
<button class="btn btn-primary">Schedule</button>
</form>
</div>
{% endblock %}
