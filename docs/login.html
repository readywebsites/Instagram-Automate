<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IG Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top left, #fce7f3, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #ffffff;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 44px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .brand {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #111827;
        }

        .brand span {
            background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-control {
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }

        .form-control:focus {
            border-color: #833ab4;
            box-shadow: 0 0 0 4px rgba(131, 58, 180, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #000;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="login-card">
    <a href="./index.html" class="brand">
        <i class="bi bi-calendar-range-fill text-warning"></i>
        <span>IG</span> Scheduler
    </a>

    <p class="subtitle">
        Login to manage your 90-day and 365-day Instagram schedules
    </p>

    <form onsubmit="event.preventDefault(); window.location.href='./dashboard.html';">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <input type="text" class="form-control" value="creator_demo" required autofocus>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-semibold m-0">Password</label>
                <a href="#" class="text-decoration-none text-muted" style="font-size: 13px;">Forgot password?</a>
            </div>
            <input type="password" class="form-control" value="••••••••" required>
        </div>

        <button type="submit" class="login-btn mt-3">
            Login to Dashboard <i class="bi bi-arrow-right"></i>
        </button>
    </form>

    <div class="text-center mt-4 text-muted" style="font-size: 14px;">
        Don't have an account?
        <a href="./signup.html" class="fw-bold text-dark text-decoration-none">
            Create Account
        </a>
    </div>

    <div class="text-center mt-3" style="font-size: 13px;">
        <a href="./index.html" class="text-muted text-decoration-none">
            &larr; Back to Homepage
        </a>
    </div>
</div>

</body>
</html>
