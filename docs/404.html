<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - IG Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top left, #fce7f3, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #ffffff;
            padding: 20px;
            text-align: center;
        }

        .notfound-card {
            max-width: 500px;
            background: white;
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .gradient-text {
            background: linear-gradient(90deg, #f254b5, #ff9662, #ffc85f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #f254b5, #ff9d61);
            color: white !important;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            transition: .25s;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(246,91,184,.28);
        }
    </style>
</head>
<body>

<div class="notfound-card">
    <div class="display-1 fw-bold gradient-text mb-2">404</div>
    <h3 class="fw-bold mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">
        The page you are looking for might have been moved or does not exist. Use the options below to navigate back to the site.
    </p>

    <div class="d-flex flex-wrap gap-2 justify-content-center">
        <a href="./index.html" class="btn btn-gradient">
            <i class="bi bi-house-door-fill me-1"></i> Homepage
        </a>
        <a href="./dashboard.html" class="btn btn-dark fw-bold px-4 py-2 rounded-3">
            <i class="bi bi-grid-1x2-fill me-1"></i> Dashboard
        </a>
    </div>
</div>

<script>
    // Intelligent fallback for clean URL subpaths on GitHub Pages:
    // e.g. /Instagram-Automate/dashboard -> /Instagram-Automate/dashboard.html
    const pathname = window.location.pathname;
    const cleanPath = pathname.replace(/\/$/, '');
    const knownPages = ['dashboard', 'calendar', 'upload', 'schedule', 'posts', 'schedules', 'instagram', 'settings', 'login', 'signup'];

    for (const page of knownPages) {
        if (cleanPath.endsWith('/' + page)) {
            window.location.replace(cleanPath + '.html');
            break;
        }
    }
</script>

</body>
</html>
